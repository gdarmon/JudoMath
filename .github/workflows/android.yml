name: Build Android App (TWA)

# Builds an Android APK/AAB by wrapping the deployed PWA via Bubblewrap.
#
# Triggers:
#  - manually (workflow_dispatch) — produces an unsigned debug APK as an artifact
#  - tag push v*  — produces a signed AAB ready for the Play Store, IF the
#    keystore secrets are configured. Otherwise the signed step is skipped.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Install project dependencies
        run: npm ci

      - name: Generate raster icons
        run: npm run twa:icons

      - name: Decode signing keystore (if secret provided)
        id: decode-keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Generate debug keystore (no signing secret)
        if: ${{ steps.decode-keystore.outputs.has_keystore != 'true' }}
        run: |
          keytool -genkeypair \
            -keystore android.keystore \
            -alias android \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Judo Math Debug, OU=Dev, O=JudoMath, L=Dev, S=Dev, C=US"
          echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=android" >> "$GITHUB_ENV"

      - name: Use signing secrets (release)
        if: ${{ steps.decode-keystore.outputs.has_keystore == 'true' }}
        run: |
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Bubblewrap build (APK + AAB)
        env:
          # Bubblewrap reads these for non-interactive builds.
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --skipSigning=false || \
            (echo "::warning::Bubblewrap build failed — falling back to unsigned debug build" && \
             bubblewrap build --skipPwaValidation --skipSigning)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: judomath-apk
          path: app-release-signed.apk
          if-no-files-found: warn

      - name: Upload AAB artifact (Play Store bundle)
        uses: actions/upload-artifact@v4
        with:
          name: judomath-aab
          path: app-release-bundle.aab
          if-no-files-found: warn
